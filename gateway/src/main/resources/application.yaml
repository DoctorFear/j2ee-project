server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                  - "http://127.0.0.1:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                  - PATCH
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600
          routes:
            # 1. AUTH SERVICE (.NET - Cổng 5001)
            - id: auth-service-route
              uri: http://localhost:5001
              predicates:
                - Path=/api/auth/**, /api/user/**

            # 2. BOOKING SERVICE: Ghế chuyến đi (Phải đặt trước route tổng quát của Transport Service)
            - id: booking-trip-seats-route
              uri: http://localhost:8082
              predicates:
                - Path=/api/trips/{code}/seats/**, /api/trips/{code}/seats

            # 3. BOOKING SERVICE: Đặt chỗ, giữ vé, thanh toán, vé điện tử
            - id: booking-service-route
              uri: http://localhost:8082
              predicates:
                - Path=/api/bookings/**, /api/tickets/**

            # 4. TRANSPORT SERVICE: Tuyến, trạm, lịch chạy, điều phối, quản trị
            - id: transport-service-route
              uri: http://localhost:8081
              predicates:
                - Path=/api/trips/**, /api/stations/**, /api/routes/**, /api/route-stops/**, /api/admin/**, /api/driver/**

# Chặn truy cập trực tiếp các API nội bộ /internal/** từ Gateway
futa:
  gateway:
    blocked-paths:
      - /internal
      - /admin
      - /private
