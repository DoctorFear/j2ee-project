server:
  port: 8081

spring:
  application:
    name: transport-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trip_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
